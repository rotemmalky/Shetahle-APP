<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#192b3d">
<meta name="description" content="שטחלה — בונים משימת שטח, מפיקים קובץ למבצע, פותחים תוצאות. הכול מקומי, בלי שרת.">
<title>שטחלה — כלי המנהל</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-apple-touch.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="שטחלה">

<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="shell">
  <div class="topbar">
    <div class="brand">
      <span class="mark">✓</span>
      <div class="titles"><span>שטחלה</span><small>כלי המנהל</small></div>
    </div>
    <span class="status-dot"><i></i> שמירה מקומית פעילה</span>
  </div>

  <div id="install-banner" class="install-banner">
    <span class="ic">📲</span>
    <div class="txt"><b>אפשר להתקין את שטחלה על הטלפון</b><span>אייקון על מסך הבית, עובד גם בלי אינטרנט</span></div>
    <button class="btn ghost sm" id="install-btn">התקנה</button>
  </div>

  <div id="app"></div>
</div>

<input id="import-task-input" type="file" accept=".html" hidden>
<input id="import-result-input" type="file" accept=".html" hidden>
<div id="toast-region" class="toast-region"></div>

<script src="./app.js"></script>
</body>
</html>
