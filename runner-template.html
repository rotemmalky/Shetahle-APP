<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__ — שטחלה</title>
<style>
:root{--ink:#16202e;--ink-2:#54636f;--ink-3:#8090a1;--cyan:#0e8fb0;--cyan-2:#1f9ed4;--cyan-soft:#e7f4f8;--paper:#f4f6fa;--line:#e3e9f1;--red:#c0392b;--amber:#b7791f;--amber-soft:#fdf6e6;--shadow:0 18px 40px -18px rgba(15,31,46,.22)}
*{box-sizing:border-box}
body{margin:0;direction:rtl;font-family:"Heebo","Assistant",system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:16.5px;line-height:1.65;min-height:100dvh}
button,input,select,textarea{font:inherit}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;margin-bottom:16px;color:var(--ink)}
.top .mark{width:32px;height:32px;border-radius:11px;background:linear-gradient(150deg,#22394f,#0f1f2e);color:#5cc8f0;display:grid;place-items:center;font-weight:800;font-size:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}
.badge{display:inline-block;font-size:12.5px;font-weight:800;color:#0e6f8a;background:var(--cyan-soft);padding:5px 13px;border-radius:100px;margin-bottom:12px}
h1{font-size:23px;margin:0 0 10px;letter-spacing:-.3px}
.card>p{color:var(--ink-2);margin:0 0 16px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:9px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin:16px 0;font-size:13px;color:var(--ink-2)}
.meta b{display:block;color:var(--ink);font-size:14.5px;margin-top:3px}
.privacy{font-size:12.5px;color:var(--ink-2);background:#eef2ec;border-radius:14px;padding:11px 13px;line-height:1.55;margin:14px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16.5px;padding:14px 26px;border-radius:100px;cursor:pointer;border:0;background:var(--cyan-2);color:#fff;width:100%}
.btn.ghost{background:#fff;border:1.6px solid var(--line);color:var(--ink)}
.btn.dark{background:linear-gradient(150deg,#22394f,#0f1f2e);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.btn:active{transform:scale(.98)}
.progress{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.bar{height:7px;background:#e6ebf2;border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--cyan-2);border-radius:99px}
.section-label{color:var(--cyan);font-weight:700;font-size:13px;margin:0 0 8px}
.q{font-size:21px;font-weight:800;margin:0 0 6px;line-height:1.3}
.req{color:var(--red)}
.help{color:var(--ink-2);font-size:14px;margin:0 0 16px}
.answer-input{width:100%;font-size:17px;padding:13px;border:1.6px solid var(--line);border-radius:14px;outline:none}
.answer-input:focus{border-color:var(--cyan-2);box-shadow:0 0 0 3px rgba(31,158,212,.16)}
textarea.answer-input{min-height:110px;resize:vertical}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{border:1.6px solid var(--line);border-radius:14px;padding:16px;background:#fff;font-size:15.5px;text-align:center;cursor:pointer}
.choice.active{border-color:var(--cyan-2);background:var(--cyan-soft);color:#0e6f8a;font-weight:700}
.photo-zone{border:2px dashed #b9d3e0;border-radius:16px;padding:22px;text-align:center;background:#f4fafd}
.photo-zone input{display:none}
.photo-zone label{cursor:pointer;display:block}
.photo-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.photo-item{position:relative}
.photo-preview img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:11px;display:block}
.photo-item .rm{position:absolute;top:-7px;inset-inline-start:-7px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;border:2px solid #fff;font-size:13px;cursor:pointer;display:grid;place-items:center}
.signature{width:100%;height:190px;border:1.6px dashed #c3ccd6;border-radius:16px;background:#fbfdfe;touch-action:none}
.runner-actions{display:flex;gap:9px;margin-top:18px}
.runner-actions .btn{flex:1}
.save-note{text-align:center;color:#0e6f8a;font-size:12.5px;margin-top:12px;background:var(--cyan-soft);display:table;margin-inline:auto;padding:6px 12px;border-radius:99px}
.code-input{font-size:26px;letter-spacing:12px;text-align:center;direction:ltr;width:100%;max-width:220px;margin:14px auto;display:block;border:1.6px solid var(--line);border-radius:14px;padding:12px;outline:none}
.toast-region{position:fixed;bottom:16px;left:16px;right:16px;z-index:20;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#16202e;color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow);max-width:340px}
.warn-toast{background:var(--amber-soft);color:#7a5b12;border:1px solid #ead9a3}
#draft-warn{position:fixed;top:12px;left:12px;right:12px;z-index:50;background:var(--amber-soft);color:#7a5b12;border:1px solid #ead9a3;border-radius:14px;padding:12px 16px;font-size:13.5px;font-weight:600;text-align:center;box-shadow:var(--shadow);max-width:520px;margin:0 auto}
.err{color:var(--red);font-size:13.5px;margin-top:4px;min-height:16px}
.review-list{margin-top:14px;display:grid;gap:8px}
.rev-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.rev-info{flex:1;min-width:0}
.rev-q{font-size:12.5px;color:var(--ink-2);margin-bottom:2px}
.rev-a{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="mark">✓</span><span>שטחלה</span></div>
  <div id="app"></div>
</div>
<script id="shtachla-task-src" type="application/json">__TASKSRC__</script>
<div id="toast-region" class="toast-region"></div>
<script>
const TASK = __TASK__;
const RESULT_TEMPLATE = "<!DOCTYPE html>\n<html lang=\"he\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>__TITLE__ \u2014 \u05ea\u05d5\u05e6\u05d0\u05d4 \u05de\u05e9\u05d8\u05d7\u05dc\u05d4</title>\n<style>\n:root{--ink:#16202e;--ink-2:#54636f;--ink-3:#8090a1;--cyan:#0e8fb0;--cyan-soft:#e7f4f8;--line:#e3e9f1;--amber:#b7791f;--amber-soft:#fdf6e6;--red:#c0392b;--paper:#f4f6fa;--shadow:0 18px 40px -18px rgba(15,31,46,.22)}\n*{box-sizing:border-box}\nbody{margin:0;direction:rtl;font-family:\"Heebo\",\"Assistant\",system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.65}\n.wrap{max-width:760px;margin:0 auto;padding:22px 18px 60px}\n.top{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;margin-bottom:18px}\n.top .mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(150deg,#22394f,#0f1f2e);color:#5cc8f0;display:grid;place-items:center;font-weight:800}\n.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}\n.lockbox{text-align:center;padding:20px 6px}\n.lockbox .ic{font-size:36px;margin-bottom:10px}\n.lockbox h1{font-size:21px;margin:0 0 8px}\n.lockbox p{color:var(--ink-2);margin:0 0 18px;font-size:15px}\n.code-input{font-size:26px;letter-spacing:12px;text-align:center;direction:ltr;width:100%;max-width:220px;margin:0 auto 14px;display:block;border:1.6px solid var(--line);border-radius:14px;padding:12px;outline:none}\n.code-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(14,143,176,.16)}\n.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:16px;padding:13px 26px;border-radius:100px;cursor:pointer;border:0;background:var(--cyan);color:#fff}\n.btn.wide{width:100%;justify-content:center}\n.btn.ghost{background:#fff;border:1.6px solid var(--line);color:var(--ink)}\n.err{color:var(--red);font-size:14px;margin-top:6px;min-height:18px}\n.rep-head{margin-bottom:18px}\n.rep-head .badge{display:inline-block;font-size:12.5px;font-weight:800;color:#0e6f8a;background:var(--cyan-soft);padding:5px 13px;border-radius:100px;margin-bottom:9px}\n.rep-head h1{font-size:23px;margin:0 0 4px}\n.rep-head p{color:var(--ink-2);margin:0;font-size:14px}\n.actions{display:flex;gap:9px;margin:16px 0 6px;flex-wrap:wrap}\n.band{font-weight:800;font-size:13px;color:var(--cyan);margin:22px 0 10px;padding-bottom:7px;border-bottom:2px solid var(--line)}\n.band:first-of-type{margin-top:6px}\n.row{border-bottom:1px solid var(--line);padding:13px 0}\n.row:last-child{border-bottom:0}\n.row .q{font-size:12.5px;font-weight:700;color:var(--ink-3);margin-bottom:5px}\n.row .a{color:var(--ink);white-space:pre-wrap;font-size:15.5px}\n.row .a em{color:var(--ink-3);font-style:normal}\n.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}\n.imgs img{width:110px;height:82px;object-fit:cover;border-radius:11px;border:1px solid var(--line)}\n.sig{max-width:220px;max-height:96px;display:block;border:1px solid var(--line);border-radius:10px;margin-top:6px;background:#fff}\n.note{font-size:12.5px;color:var(--ink-2);background:#eef2ec;border-radius:12px;padding:11px 14px;margin-top:20px}\n@media print{.top,.actions,.note{display:none!important}.card{box-shadow:none;border:0}body{background:#fff}}\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n  <div class=\"top\"><span class=\"mark\">\u2713</span><span>\u05e9\u05d8\u05d7\u05dc\u05d4</span></div>\n  <div id=\"app\" class=\"card\"></div>\n</div>\n<script>\nconst HEADER = __HEADER__;\nconst PAYLOAD_B64 = \"__PAYLOAD__\";\nconst app = document.getElementById('app');\nconst decoder = new TextDecoder();\nconst b64ToBytes = v => Uint8Array.from(atob(v), c => c.charCodeAt(0));\nconst esc = v => String(v ?? '').replace(/[&<>'\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',\"'\":'&#39;','\"':'&quot;'}[c]));\n\nfunction renderAnswer(row){\n  if (Array.isArray(row.answer)) return row.answer.length ? `<div class=\"imgs\">${row.answer.map(i=>`<img src=\"${i}\">`).join('')}</div>` : '<em>\u05dc\u05d0 \u05e6\u05d5\u05e8\u05e4\u05d4 \u05ea\u05de\u05d5\u05e0\u05d4</em>';\n  if (row.type === 'signature' && row.answer) return `<img class=\"sig\" src=\"${row.answer}\">`;\n  if (row.type === 'gps' && row.answer && row.answer.latitude) return `\u05e7\u05d5 \u05e8\u05d5\u05d7\u05d1 ${row.answer.latitude.toFixed(6)}, \u05e7\u05d5 \u05d0\u05d5\u05e8\u05da ${row.answer.longitude.toFixed(6)} \u00b7 \u05d3\u05d9\u05d5\u05e7 ${Math.round(row.answer.accuracy||0)} \u05de\u05f3`;\n  return (row.answer === null || row.answer === undefined || row.answer === '') ? '<em>\u05dc\u05d0 \u05de\u05d5\u05dc\u05d0</em>' : esc(row.answer);\n}\n\nfunction renderReport(payload){\n  const secs = []; payload.answers.forEach(r => { const s = r.section || '\u05db\u05dc\u05dc\u05d9'; if (!secs.includes(s)) secs.push(s); });\n  const body = secs.map(s => {\n    const rows = payload.answers.filter(r => (r.section||'\u05db\u05dc\u05dc\u05d9') === s)\n      .map(r => `<div class=\"row\"><div class=\"q\">${esc(r.label)}</div><div class=\"a\">${renderAnswer(r)}</div></div>`).join('');\n    return `<div class=\"band\">${esc(s)}</div>${rows}`;\n  }).join('');\n  app.innerHTML = `\n    <div class=\"rep-head\">\n      <span class=\"badge\">\u2713 ${HEADER.locked ? '\u05e4\u05d5\u05e2\u05e0\u05d7 \u05d1\u05d4\u05e6\u05dc\u05d7\u05d4' : '\u05ea\u05d5\u05e6\u05d0\u05d4 \u05e4\u05ea\u05d5\u05d7\u05d4'}</span>\n      <h1>${esc(payload.task.title)}</h1>\n      <p>${esc(payload.task.site || '\u05dc\u05dc\u05d0 \u05d0\u05ea\u05e8')} \u00b7 \u05d4\u05d5\u05e9\u05dc\u05dd ${new Date(payload.metadata.completedAt).toLocaleDateString('he-IL')}</p>\n    </div>\n    <div class=\"actions\"><button class=\"btn\" id=\"pdf-btn\">\ud83d\udda8\ufe0f \u05d9\u05d9\u05e6\u05d5\u05d0 PDF</button><button class=\"btn ghost\" id=\"csv-btn\">\ud83d\udcca \u05d9\u05d9\u05e6\u05d5\u05d0 Excel</button></div>\n    ${body}\n    <div class=\"note\">\u05e7\u05d5\u05d1\u05e5 \u05ea\u05d5\u05e6\u05d0\u05d4 \u05e9\u05dc \u05e9\u05d8\u05d7\u05dc\u05d4. \u05e0\u05d5\u05e6\u05e8 \u05d1\u05de\u05db\u05e9\u05d9\u05e8 \u05d4\u05de\u05d1\u05e6\u05e2, \u05dc\u05dc\u05d0 \u05e9\u05e8\u05ea \u05d5\u05dc\u05d0 \u05e2\u05e0\u05df.</div>`;\n  document.getElementById('pdf-btn').onclick = () => window.print();\n  document.getElementById('csv-btn').onclick = () => {\n    const cols = payload.answers.map(r => [r.section, r.label, Array.isArray(r.answer) ? `${r.answer.length} \u05ea\u05de\u05d5\u05e0\u05d5\u05ea` : (typeof r.answer === 'object' && r.answer ? JSON.stringify(r.answer) : r.answer)]);\n    const csv = '\\ufeff\u05e1\u05e2\u05d9\u05e3,\u05e9\u05d0\u05dc\u05d4,\u05ea\u05e9\u05d5\u05d1\u05d4\\n' + cols.map(row => row.map(v => `\"${String(v ?? '').replaceAll('\"','\"\"')}\"`).join(',')).join('\\n');\n    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'})); a.download = `${payload.task.title}-\u05ea\u05d5\u05e6\u05d0\u05d5\u05ea.csv`; a.click();\n  };\n}\n\nasync function unlockWith(code){\n  const encoder = new TextEncoder();\n  const material = await crypto.subtle.importKey('raw', encoder.encode(code), 'PBKDF2', false, ['deriveKey']);\n  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64ToBytes(HEADER.salt), iterations:HEADER.iterations, hash:'SHA-256'}, material, {name:'AES-GCM', length:256}, false, ['decrypt']);\n  const encrypted = b64ToBytes(PAYLOAD_B64).buffer;\n  const data = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToBytes(HEADER.iv)}, key, encrypted);\n  return JSON.parse(decoder.decode(data));\n}\n\nfunction showLock(){\n  app.innerHTML = `<div class=\"lockbox\"><div class=\"ic\">\ud83d\udd12</div><h1>\u05ea\u05d5\u05e6\u05d0\u05d4 \u05de\u05d5\u05d2\u05e0\u05ea \u05d1\u05e7\u05d5\u05d3</h1><p>\u05d4\u05d6\u05df \u05d0\u05ea \u05d4\u05e7\u05d5\u05d3 \u05d1\u05df 4 \u05d4\u05e1\u05e4\u05e8\u05d5\u05ea \u05e9\u05d4\u05de\u05d1\u05e6\u05e2 \u05de\u05e1\u05e8 \u05d1\u05d8\u05dc\u05e4\u05d5\u05df.</p><input id=\"code\" class=\"code-input\" inputmode=\"numeric\" maxlength=\"4\" placeholder=\"\u2022\u2022\u2022\u2022\"><button class=\"btn wide\" id=\"unlock\">\u05e4\u05ea\u05d9\u05d7\u05ea \u05d4\u05ea\u05d5\u05e6\u05d0\u05d4</button><div class=\"err\" id=\"err\"></div></div>`;\n  document.getElementById('unlock').onclick = async () => {\n    const code = document.getElementById('code').value.trim();\n    const errEl = document.getElementById('err');\n    if (!/^\\d{4}$/.test(code)) { errEl.textContent = '\u05d9\u05e9 \u05dc\u05d4\u05d6\u05d9\u05df \u05e7\u05d5\u05d3 \u05d1\u05df 4 \u05e1\u05e4\u05e8\u05d5\u05ea.'; return; }\n    try { const payload = await unlockWith(code); renderReport(payload); }\n    catch { errEl.textContent = '\u05d4\u05e7\u05d5\u05d3 \u05e9\u05d2\u05d5\u05d9, \u05d0\u05d5 \u05e9\u05d4\u05e7\u05d5\u05d1\u05e5 \u05e0\u05e4\u05d2\u05dd. \u05dc\u05d0 \u05e0\u05d7\u05e9\u05e3 \u05de\u05d9\u05d3\u05e2 \u05d7\u05dc\u05e7\u05d9.'; }\n  };\n  document.getElementById('code').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('unlock').click(); });\n}\n\n(function init(){\n  if (HEADER.locked) { showLock(); return; }\n  try { renderReport(JSON.parse(decoder.decode(b64ToBytes(PAYLOAD_B64)))); }\n  catch (e) { app.innerHTML = `<div class=\"lockbox\"><div class=\"ic\">\u26a0\ufe0f</div><h1>\u05dc\u05d0 \u05e0\u05d9\u05ea\u05df \u05dc\u05e7\u05e8\u05d5\u05d0 \u05d0\u05ea \u05d4\u05e7\u05d5\u05d1\u05e5</h1><p>\u05d4\u05e7\u05d5\u05d1\u05e5 \u05e2\u05e9\u05d5\u05d9 \u05dc\u05d4\u05d9\u05d5\u05ea \u05e4\u05d2\u05d5\u05dd.</p></div>`; }\n})();\n<\/script>\n</body>\n</html>\n";
const app = document.getElementById('app');
const encoder = new TextEncoder();
const esc = v => String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const isSecure = () => location.protocol === 'https:' || location.hostname === 'localhost' || location.protocol === 'file:';
const bytesToB64 = bytes => { const arr = new Uint8Array(bytes); const chunk = 0x8000; const parts = []; for (let i=0;i<arr.length;i+=chunk) parts.push(String.fromCharCode.apply(null, arr.subarray(i,i+chunk))); return btoa(parts.join('')); };
function toast(msg, warn){ const n=document.createElement('div'); n.className='toast'+(warn?' warn-toast':''); n.textContent=msg; document.getElementById('toast-region').append(n); setTimeout(()=>n.remove(),3200); }

function compressImage(file, maxDim, quality){
  maxDim = maxDim || 1920; quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      try { resolve(canvas.toDataURL('image/jpeg', quality)); } catch (e) { reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image-decode-failed')); };
    img.src = url;
  });
}

let state = { step:0, answers:{}, returnToReview:false };
try { const saved = JSON.parse(localStorage.getItem('shtachla-draft-'+TASK.id)||'null'); if (saved) state = Object.assign({returnToReview:false}, saved); } catch {}

function showDraftWarning(){
  if (document.getElementById('draft-warn')) return;
  const n = document.createElement('div'); n.id = 'draft-warn';
  n.textContent = '⚠️ השמירה האוטומטית נכשלה (אין מקום פנוי באחסון). אפשר להמשיך למלא — אבל אין לסגור את הדף עד שנוצר ונשלח קובץ התוצאה.';
  document.body.prepend(n);
}
function clearDraftWarning(){ const n = document.getElementById('draft-warn'); if (n) n.remove(); }
function persistDraft(){
  try { localStorage.setItem('shtachla-draft-'+TASK.id, JSON.stringify(state)); clearDraftWarning(); }
  catch (e) { showDraftWarning(); }
}

function introView(){
  app.innerHTML = `
    <div class="card">
      <span class="badge">✦ משימת שטח</span>
      <h1>${esc(TASK.title)}</h1>
      <p>${esc(TASK.description || 'השלם את הפעולות לפי הסדר. הכול נשמר במכשיר שלך בזמן העבודה.')}</p>
      <div class="meta">
        <div>אתר / לקוח<b>${esc(TASK.site || 'לא צוין')}</b></div>
        <div>זמן משוער<b>${esc(TASK.estimated || 'לא צוין')}</b></div>
        <div>שולח<b>${esc(TASK.owner || 'מנהל המשימה')}</b></div>
        <div>כולל<b>${TASK.fields.length} פעולות</b></div>
      </div>
      <div class="privacy">🔒 המידע נשמר במכשיר הזה בזמן העבודה. בסיום ייווצר קובץ אחד שתבחר בעצמך למי לשלוח.</div>
      <button class="btn" id="start">התחלת המשימה ←</button>
      ${state.step > 0 ? '<p class="save-note">נמצאה טיוטה קודמת — נמשיך מאיפה שעצרת</p>' : ''}
    </div>`;
  document.getElementById('start').onclick = () => runnerView();
}

function photoPreview(answer){
  if (!Array.isArray(answer) || !answer.length) return '';
  return `<div class="photo-preview">${answer.map((u,idx)=>`<div class="photo-item"><img src="${u}"><button type="button" class="rm" data-rmphoto="${idx}">×</button></div>`).join('')}</div>`;
}

function fieldInput(field, answer){
  const value = (typeof answer === 'string' || typeof answer === 'number') ? answer : '';
  if (field.type === 'textarea') return `<textarea class="answer-input" id="answer" rows="5" placeholder="כתוב כאן...">${esc(value)}</textarea>`;
  if (field.type === 'number') return `<input class="answer-input" id="answer" type="number" inputmode="decimal" value="${esc(value)}" placeholder="הזן מספר">`;
  if (field.type === 'date') return `<input class="answer-input" id="answer" type="date" value="${esc(value)}">`;
  if (field.type === 'yesno') return `<div class="choice-grid"><button class="choice ${answer==='כן'?'active':''}" type="button" data-answer="כן">✓ כן, תקין</button><button class="choice ${answer==='לא'?'active':''}" type="button" data-answer="לא">✕ לא תקין</button></div>`;
  if (field.type === 'select') { const opts = (field.options && field.options.length ? field.options : ['תקין','נדרש טיפול','לא רלוונטי']); return `<select class="answer-input" id="answer"><option value="">בחר תשובה</option>${opts.map(o=>`<option ${answer===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`; }
  if (field.type === 'photo') return `<div class="photo-zone"><label for="photo-input"><span style="font-size:30px;display:block;margin-bottom:8px">📷</span><b>לחץ לצילום או בחירת תמונה</b><br><span style="font-size:12.5px;color:var(--ink-2)">התמונה תישמר מכווצת לגודל שליחה</span></label><input id="photo-input" type="file" accept="image/*" multiple>${photoPreview(answer)}</div>`;
  if (field.type === 'gps') return `<div class="photo-zone"><span style="font-size:30px;display:block;margin-bottom:8px">📍</span><b>${answer && answer.latitude ? 'המיקום נשמר' : 'שמירת מיקום נוכחי'}</b><div style="margin-top:12px"><button class="btn ghost" id="gps-btn" type="button" style="width:auto;padding:12px 20px">${answer && answer.latitude ? 'עדכון מיקום' : 'שמור מיקום'}</button></div><div id="gps-res" style="font-size:12.5px;color:var(--ink-2);margin-top:10px">${answer && answer.latitude ? `דיוק ${Math.round(answer.accuracy||0)} מ׳` : ''}</div></div>`;
  if (field.type === 'signature') return `<p style="font-size:13px;color:var(--ink-2);margin:0 0 8px">חתום עם האצבע בתוך המסגרת</p><canvas id="signature" class="signature"></canvas><button class="btn ghost" id="clear-sig" type="button" style="margin-top:9px">נקה חתימה</button>`;
  return `<input class="answer-input" id="answer" value="${esc(value)}" placeholder="הקלד תשובה">`;
}

function bindFieldEvents(field){
  const input = document.getElementById('answer');
  if (input) input.addEventListener('input', () => { state.answers[field.id] = input.value; persistDraft(); });
  document.querySelectorAll('[data-answer]').forEach(b => b.addEventListener('click', () => { state.answers[field.id] = b.dataset.answer; persistDraft(); runnerView(); }));
  const photoInput = document.getElementById('photo-input');
  if (photoInput) photoInput.addEventListener('change', async () => {
    const files = [...photoInput.files];
    if (!files.length) return;
    let added;
    try { added = await Promise.all(files.map(f => compressImage(f))); }
    catch { toast('לא ניתן היה לעבד תמונה אחת או יותר.', true); return; }
    state.answers[field.id] = [...(state.answers[field.id]||[]), ...added];
    persistDraft(); runnerView();
  });
  document.querySelectorAll('[data-rmphoto]').forEach(b => b.addEventListener('click', () => {
    const idx = +b.dataset.rmphoto;
    const arr = state.answers[field.id];
    if (Array.isArray(arr)) { arr.splice(idx,1); persistDraft(); runnerView(); }
  }));
  const gpsBtn = document.getElementById('gps-btn');
  if (gpsBtn) gpsBtn.addEventListener('click', () => {
    if (!navigator.geolocation) { toast('מיקום לא נתמך בדפדפן זה.', true); return; }
    gpsBtn.textContent = 'מאתר מיקום…';
    navigator.geolocation.getCurrentPosition(pos => {
      state.answers[field.id] = { latitude: pos.coords.latitude, longitude: pos.coords.longitude, accuracy: pos.coords.accuracy, capturedAt: Date.now() };
      persistDraft(); runnerView();
    }, () => { gpsBtn.textContent = 'שמור מיקום'; toast('לא ניתן היה לקבל מיקום.', true); }, { enableHighAccuracy:true, timeout:10000, maximumAge:0 });
  });
  const clearSig = document.getElementById('clear-sig');
  const canvas = document.getElementById('signature');
  if (canvas) initSignature(canvas, field, state.answers[field.id]);
  if (clearSig) clearSig.addEventListener('click', () => { state.answers[field.id] = ''; persistDraft(); runnerView(); });
}

function initSignature(canvas, field, existing){
  const ctx = canvas.getContext('2d'); const ratio = window.devicePixelRatio || 1;
  function resize(){ canvas.width = canvas.clientWidth * ratio; canvas.height = canvas.clientHeight * ratio; ctx.scale(ratio, ratio); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#16202e'; ctx.lineWidth=2.2; if (existing) { const img = new Image(); img.onload = () => ctx.drawImage(img,0,0,canvas.clientWidth,canvas.clientHeight); img.src = existing; } }
  resize();
  let drawing = false;
  const point = e => { const rect = canvas.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e; return { x: p.clientX - rect.left, y: p.clientY - rect.top }; };
  canvas.addEventListener('pointerdown', e => { drawing = true; const p = point(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); });
  canvas.addEventListener('pointermove', e => { if (!drawing) return; const p = point(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); });
  const end = () => { if (drawing) { drawing = false; state.answers[field.id] = canvas.toDataURL('image/png'); persistDraft(); } };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointerleave', end);
}

function collectPlainAnswer(field){
  const input = document.getElementById('answer');
  if (input) state.answers[field.id] = input.value;
}

function runnerView(){
  const field = TASK.fields[state.step];
  if (!field) return reviewView();
  const answer = state.answers[field.id];
  const progressPct = Math.round((state.step / TASK.fields.length) * 100);
  const editing = !!state.returnToReview;
  app.innerHTML = `
    <div class="progress"><span>${esc(field.section || 'משימה')}</span><span>${state.step+1} מתוך ${TASK.fields.length}</span></div>
    <div class="bar"><i style="width:${progressPct}%"></i></div>
    <div class="card">
      <p class="section-label">פעולה ${String(state.step+1).padStart(2,'0')}</p>
      <h1>${esc(field.label)} ${field.required ? '<span class="req">*</span>' : ''}</h1>
      ${field.help ? `<p class="help">${esc(field.help)}</p>` : ''}
      ${fieldInput(field, answer)}
      <div class="err" id="step-err"></div>
      <div class="runner-actions">
        ${editing ? '' : `<button class="btn ghost" id="prev" ${state.step===0?'disabled':''}>→ חזרה</button>`}
        <button class="btn dark" id="next">${editing ? 'שמירה וחזרה לסקירה ←' : (state.step === TASK.fields.length-1 ? 'לסיום המשימה' : 'המשך ←')}</button>
      </div>
    </div>
    <p class="save-note">✓ נשמר אוטומטית במכשיר</p>`;
  bindFieldEvents(field);
  if (!editing) document.getElementById('prev').onclick = () => { state.step--; persistDraft(); runnerView(); };
  document.getElementById('next').onclick = () => {
    collectPlainAnswer(field);
    const a = state.answers[field.id];
    const empty = a === undefined || a === null || a === '' || (Array.isArray(a) && !a.length);
    if (field.required && empty) { document.getElementById('step-err').textContent = 'הפעולה הזו חובה לפני שממשיכים.'; return; }
    if (editing) { state.returnToReview = false; persistDraft(); reviewView(); return; }
    state.step++; persistDraft(); runnerView();
  };
}

function reviewSummary(field){
  const a = state.answers[field.id];
  if (Array.isArray(a)) return a.length ? a.length + ' תמונות' : '—';
  if (field.type === 'signature') return a ? 'חתום ✓' : '—';
  if (field.type === 'gps') return (a && a.latitude) ? 'מיקום נשמר ✓' : '—';
  return (a === undefined || a === null || a === '') ? '—' : String(a);
}
function reviewView(){
  const rows = TASK.fields.map((f, i) => `<div class="rev-row"><div class="rev-info"><div class="rev-q">${esc(f.label)}</div><div class="rev-a">${esc(reviewSummary(f))}</div></div><button class="btn ghost" data-edit="${i}" type="button" style="width:auto;min-height:36px;padding:0 14px;font-size:13px">עריכה</button></div>`).join('');
  app.innerHTML = `
    <div class="card">
      <span class="badge">🔍 סקירה אחרונה</span>
      <h1>בדוק לפני שליחה</h1>
      <p>עבור על התשובות. אם משהו לא נכון — לחץ "עריכה" וחזור לתקן. זו ההזדמנות לתקן טעויות שטח.</p>
      <div class="review-list">${rows}</div>
      <button class="btn" id="to-finish" style="margin-top:16px">הכל תקין — להפקת הקובץ ←</button>
    </div>`;
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { state.step = +b.dataset.edit; state.returnToReview = true; persistDraft(); runnerView(); });
  document.getElementById('to-finish').onclick = () => finishView();
}

let resultCode = '';
function finishView(){
  const cryptoOK = isSecure() && window.crypto && window.crypto.subtle;
  app.innerHTML = `
    <div class="card">
      <span class="badge">✓ כל הפעולות הושלמו</span>
      <h1>עכשיו יוצרים את הקובץ</h1>
      <p>${cryptoOK ? 'אפשר להוסיף קוד בן 4 ספרות שינעל את הקובץ (לא חובה).' : 'ההצפנה אינה זמינה בדפדפן הזה — הקובץ ייווצר בלי נעילה.'}</p>
      ${cryptoOK ? `<input id="code" class="code-input" inputmode="numeric" maxlength="4" placeholder="•••• (רשות)">` : ''}
      ${cryptoOK ? `<div class="privacy">⚠️ אם בחרת קוד — <b>אל תשלח אותו יחד עם הקובץ.</b> מוסרים אותו למנהל בשיחת טלפון בלבד.</div>` : ''}
      <button class="btn" id="create">יצירת קובץ תוצאה</button>
    </div>`;
  if (cryptoOK) document.getElementById('code').addEventListener('input', e => { resultCode = e.target.value.trim(); });
  document.getElementById('create').onclick = async () => {
    const btn = document.getElementById('create'); btn.disabled = true; btn.textContent = 'יוצר קובץ…';
    try { const blob = await buildResultBlob(cryptoOK); shareView(blob); }
    catch (e) { toast(e.message || 'יצירת הקובץ נכשלה.', true); btn.disabled = false; btn.textContent = 'יצירת קובץ תוצאה'; }
  };
}

async function buildResultBlob(cryptoOK){
  const payload = { format:'shtachla-result-payload', version:2, createdAt: Date.now(), task: TASK, answers: TASK.fields.map(f => ({ fieldId:f.id, label:f.label, section:f.section, type:f.type, required: !!f.required, answer: state.answers[f.id] ?? null })), metadata: { completedAt: Date.now(), userAgent: navigator.userAgent } };
  const payloadBytes = encoder.encode(JSON.stringify(payload));
  let header, payloadB64;
  const useCode = cryptoOK && /^\d{4}$/.test(resultCode);
  if (useCode) {
    const salt = crypto.getRandomValues(new Uint8Array(16)); const iv = crypto.getRandomValues(new Uint8Array(12)); const iterations = 200000;
    const material = await crypto.subtle.importKey('raw', encoder.encode(resultCode), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations, hash:'SHA-256'}, material, {name:'AES-GCM', length:256}, false, ['encrypt']);
    const encrypted = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, payloadBytes);
    header = { locked:true, salt:bytesToB64(salt), iv:bytesToB64(iv), iterations };
    payloadB64 = bytesToB64(encrypted);
  } else {
    header = { locked:false };
    payloadB64 = bytesToB64(payloadBytes);
  }
  const safeTitle = (TASK.title || 'תוצאת שטחלה').replace(/[<>]/g,'');
  const headerJson = JSON.stringify(header);
  const html = RESULT_TEMPLATE
    .replace('__TITLE__', () => safeTitle)
    .replace('__HEADER__', () => headerJson)
    .replace('__PAYLOAD__', () => payloadB64);
  return new Blob([html], { type:'text/html' });
}

function shareView(blob){
  const filename = (TASK.title.replace(/[^\p{L}\p{N}]+/gu,'-') || 'תוצאה') + '-' + new Date().toISOString().slice(0,10) + '.html';
  const canShare = !!navigator.canShare && navigator.canShare({ files: [new File([blob], filename, {type:'text/html'})] });
  app.innerHTML = `
    <div class="card">
      <span class="badge">✓ הקובץ מוכן</span>
      <h1>סיימנו. שולחים נכון.</h1>
      <p>נוצר קובץ אחד. שלח אותו למנהל <b>כמסמך</b> בוואטסאפ (לא כתמונה), ואם בחרת קוד — מסור אותו בשיחת טלפון.</p>
      <div class="privacy" style="margin-bottom:4px"><b>${esc(filename)}</b><br>${(blob.size/1024/1024).toFixed(2)}MB</div>
      <button class="btn" id="share-btn">${canShare ? 'שליחה / שיתוף' : 'הורדת הקובץ'}</button>
      <button class="btn ghost" id="dl-btn" style="margin-top:9px">הורדה בלבד</button>
      <button class="btn dark" id="done-btn" style="margin-top:16px">אישרתי ששלחתי — מחיקת נתונים מהמכשיר</button>
    </div>`;
  document.getElementById('share-btn').onclick = async () => {
    if (canShare) { try { await navigator.share({ title:'תוצאת שטחלה', text:'קובץ תוצאה משטחלה — לפתוח בדפדפן.', files:[new File([blob], filename, {type:'text/html'})] }); } catch {} }
    else downloadBlob(blob, filename);
  };
  document.getElementById('dl-btn').onclick = () => downloadBlob(blob, filename);
  document.getElementById('done-btn').onclick = () => { try { localStorage.removeItem('shtachla-draft-'+TASK.id); } catch {} app.innerHTML = `<div class="card" style="text-align:center"><h1>הנתונים נמחקו</h1><p>אפשר לסגור את הדף.</p></div>`; };
}
function downloadBlob(blob, filename){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 800); }

introView();
</script>
</body>
</html>
